name: demo site
# Publishes the dashboard with the fictional example data (examples/) to GitHub Pages.
# Nothing personal is involved: only examples/ and Translink's public timetable are used.
on:
  push:
    branches: [master]
    paths: ["dashboard/**", "scripts/**", "examples/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_gtfs.py
      - name: Build the demo
        run: |
          mkdir -p _site
          cp dashboard/index.html dashboard/app.js dashboard/style.css _site/
          python scripts/build.py --demo --out _site/data.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
