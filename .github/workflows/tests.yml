name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # report every Python version, even if one fails
      matrix:
        python: ["3.10", "3.14"]  # oldest available on the runner, and newest stable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      # no network or credentials needed: the go card site and the GTFS feed are faked
      - run: python -m unittest discover tests -v
